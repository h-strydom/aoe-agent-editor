name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # Failures become check-run annotations, readable without signing in.
      - run: uv run --with pytest-github-actions-annotate-failures pytest -q -rf --tb=short
